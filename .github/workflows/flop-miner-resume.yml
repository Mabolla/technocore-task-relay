name: FLOP miner controlled resume
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [test-only]
        default: test-only
        required: true
      paid_host_authorized:
        type: boolean
        default: false
        required: true
permissions: {}
jobs:
  live-read-only:
    if: inputs.mode == 'test-only' && inputs.paid_host_authorized == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLOP_IMAGE: ghcr.io/flop-labs/flop-core/cli:v0.1.290@sha256:24e32b034b0d3600ee28127dad30d4228e623235f2dc62da34c2c85ba5e21a88
      FLOP_RPC: wss://rpc.devnet.flop.network
      FLOP_MINER: 5Ek2J6WSgcunfe8hLRpZRGnCa3aUmvZAMGM5ugfyJ2VhtrWw
    steps:
      - name: Verify live Devnet and public miner status without a signer
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$FLOP_IMAGE"
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges "$FLOP_IMAGE" --network devnet --rpc "$FLOP_RPC" network status --json | tee network.json
          jq -e '.rpc.genesis_hash == "0x99c172c095340ace980631f9123544c6bebd4839f3437e463533422d8be2d631" and .faucet.matches_rpc == true' network.json
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges "$FLOP_IMAGE" --network devnet --rpc "$FLOP_RPC" miner status "$FLOP_MINER" --json | tee miner.json
          jq -e '(.registered | type == "boolean") and (.ok != false)' miner.json
          {
            printf '## Live read-only CLI probe\n'
            printf 'Genesis matched. CLI image: %s\n\n' "$FLOP_IMAGE"
            jq -r '"Public miner registered: " + (.registered | tostring)' miner.json
            printf '\nNo signer, SSH, mounts, sponsorship, or Vast actions.\n'
          } >> "$GITHUB_STEP_SUMMARY"
