name: Diagnose Worker CPU Errors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-probe-runtime.yml

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query recent Worker invocation metrics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const since = new Date(Date.now() - 3 * 60_000).toISOString();
          const until = new Date().toISOString();
          const query = `query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) {
            viewer { accounts(filter: {accountTag: $accountTag}) {
              workersInvocationsAdaptive(limit: 100, filter: {
                scriptName: $scriptName, datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd
              }) {
                sum { requests errors }
                quantiles { cpuTimeP50 cpuTimeP99 }
                dimensions { datetime scriptName status }
              }
            } }
          }`;
          let failed = false;
          for (const scriptName of ['mabolla-close1-agent', 'mabolla-technocore-probe-listener']) {
            const response = await fetch('https://api.cloudflare.com/client/v4/graphql', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ query, variables: {
                accountTag: process.env.CLOUDFLARE_ACCOUNT_ID,
                datetimeStart: since, datetimeEnd: until, scriptName
              } })
            });
            const body = await response.json();
            const samples = body?.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive;
            if (!response.ok || body.errors?.length || !Array.isArray(samples)) {
              console.error(JSON.stringify({ worker: scriptName, httpStatus: response.status,
                apiErrors: body.errors?.map(({ extensions }) => extensions?.code || 'graphql-error') || [] }));
              failed = true;
              continue;
            }
            const requests = samples.reduce((sum, row) => sum + (row.sum?.requests || 0), 0);
            const errors = samples.reduce((sum, row) => sum + (row.sum?.errors || 0), 0);
            console.log(JSON.stringify({ worker: scriptName, from: since, until, requests, errors,
              statuses: [...new Set(samples.map((row) => row.dimensions?.status))],
              cpuP99: samples.map((row) => row.quantiles?.cpuTimeP99) }));
            if (requests === 0) failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE
