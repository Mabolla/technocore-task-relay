name: AgentRouter Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agentrouter-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
    steps:
      - name: Request one minimal model response
        run: |
          node --input-type=module <<'NODE'
          if (!process.env.AGENTROUTER_API_KEY) throw new Error("AGENTROUTER_API_KEY is required");
          const response = await fetch("https://co.agentrouter.org/v1/chat/completions", {
            method: "POST",
            headers: {
              authorization: `Bearer ${process.env.AGENTROUTER_API_KEY}`,
              "content-type": "application/json"
            },
            body: JSON.stringify({
              model: "glm-5.1",
              temperature: 0,
              max_tokens: 8,
              messages: [{ role: "user", content: "Reply with exactly OK" }]
            })
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`AgentRouter HTTP ${response.status}: ${body.slice(0, 160)}`);
          let payload;
          try { payload = JSON.parse(body); }
          catch { throw new Error("AgentRouter returned non-JSON content"); }
          const content = payload?.choices?.[0]?.message?.content;
          if (typeof content !== "string" || !content.trim()) throw new Error("AgentRouter returned no model content");
          console.log(JSON.stringify({ ok: true, status: response.status, model: payload.model || "glm-5.1", contentReceived: true }));
          NODE
