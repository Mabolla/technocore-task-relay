name: Verify Technocore Check-in

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-technocore-checkin.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read and verify the accepted record
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors \
            "https://technocore.chat/r/technocore/export?n=$(date +%s)" \
            --output technocore.ndjson
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { verifySignedRecord } from "./src/probe-worker.mjs";

          const expectedDid = "did:key:z6MkfRm7VkjC52pff11L12dbFkChhVkiZqv5Wwd7VMo3fCsG";
          const requestId = "mabolla-next-competition-checkin-20260924";
          const records = fs.readFileSync("technocore.ndjson", "utf8")
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const record = records.find((item) => {
            if (item.from !== expectedDid) return false;
            try { return JSON.parse(item.text).request_id === requestId; }
            catch { return false; }
          });
          if (!record) throw new Error("signed check-in not found");
          if (!await verifySignedRecord("technocore", record, expectedDid)) {
            throw new Error("check-in signature verification failed");
          }
          console.log(JSON.stringify({
            verified: true,
            room: "technocore",
            seq: record.seq,
            ts: record.ts,
            did: record.from,
            request_id: requestId
          }));
          NODE
