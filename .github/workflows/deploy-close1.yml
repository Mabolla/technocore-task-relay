name: Deploy Close-1 Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-close1.yml
      - scripts/register-close1.mjs
      - scripts/verify-probe-identity.mjs
      - src/close1-protocol.mjs
      - src/close1-strategy.mjs
      - src/close1-trading.mjs
      - src/close1-worker.mjs
      - wrangler.close1.jsonc
      - wrangler.close1.bootstrap.jsonc

permissions:
  contents: read

concurrency:
  group: close1-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TECHNOCORE_AGENT_DID: ${{ secrets.TECHNOCORE_AGENT_DID }}
      TECHNOCORE_AGENT_PRIVATE_KEY: ${{ secrets.TECHNOCORE_AGENT_PRIVATE_KEY }}
      TECHNOCORE_URL: https://technocore.chat
      CLOSE1_REGISTRATION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate required secrets
        run: node --input-type=module -e 'for (const key of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","TECHNOCORE_AGENT_DID","TECHNOCORE_AGENT_PRIVATE_KEY"]) if (!process.env[key]) throw new Error(`${key} is required`)'
      - name: Cryptographically verify the Mabolla signing identity
        run: node scripts/verify-probe-identity.mjs
      - name: Register Mabolla for close-1 exactly once
        run: node scripts/register-close1.mjs
      - name: Create close-1 worker without a schedule
        run: npx wrangler@4.35.0 deploy --config wrangler.close1.bootstrap.jsonc
      - name: Upload encrypted close-1 runtime secrets
        run: node --input-type=module -e 'const keys=["TECHNOCORE_AGENT_DID","TECHNOCORE_AGENT_PRIVATE_KEY"]; process.stdout.write(JSON.stringify(Object.fromEntries(keys.map((key)=>[key,process.env[key]]))))' | npx wrangler@4.35.0 secret bulk --config wrangler.close1.bootstrap.jsonc
      - name: Enable the one-minute close-1 schedule
        run: npx wrangler@4.35.0 deploy --config wrangler.close1.jsonc
