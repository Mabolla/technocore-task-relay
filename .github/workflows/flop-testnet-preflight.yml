name: FLOP Testnet read-only preflight
on:
  workflow_dispatch:
    inputs:
      claim:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mabolla-flop-testnet
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --test tests/flop-testnet-preflight.test.mjs
      - name: Verify public identity and Testnet without signing
        if: "!inputs.claim"
        run: node scripts/flop-testnet-preflight.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Submit one Testnet faucet claim
        if: inputs.claim && github.ref == 'refs/heads/main'
        env:
          AGENT_KEY: ${{ secrets.TECHNOCORE_AGENT_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {createPrivateKey,createPublicKey,createHash,sign} from 'node:crypto';
          let stage='identity';
          try {
            const key = createPrivateKey({key:Buffer.from(process.env.AGENT_KEY ?? '', 'base64'),format:'der',type:'pkcs8'});
            if (key.asymmetricKeyType !== 'ed25519') throw Error();
            const raw = Buffer.from(createPublicKey(key).export({format:'jwk'}).x,'base64url');
            if (raw.length !== 32) throw Error();
            const encode = bytes => {
              const alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
              let n = BigInt('0x'+bytes.toString('hex')), out = '';
              while (n) { out = alphabet[Number(n%58n)] + out; n /= 58n; }
              return out;
            };
            const did = 'did:key:z'+encode(Buffer.concat([Buffer.of(237,1),raw]));
            const body = Buffer.concat([Buffer.of(42),raw]);
            const checksum = createHash('blake2b512').update('SS58PRE').update(body).digest().subarray(0,2);
            if (did !== 'did:key:z6MkfRm7VkjC52pff11L12dbFkChhVkiZqv5Wwd7VMo3fCsG' ||
                encode(Buffer.concat([body,checksum])) !== '5CPgb5pfqurJbZZT6ts99wCc3Npdjtfxs4VMxNnstLap1omn') throw Error();
            const genesis='0x918abd58fb16306b30ef3886514cfaebffecb4de43e82b6f8ec4795c43cfd800';
            const address='5CPgb5pfqurJbZZT6ts99wCc3Npdjtfxs4VMxNnstLap1omn';
            const faucet='https://faucet.flop.network';
            const path='/v1/testnet/agent-claims';
            const request=(url,body)=>fetch(url,{redirect:'error',signal:AbortSignal.timeout(15000),...(body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{})});
            stage='network and limits';
            const checks=await Promise.all([request('https://testnet.flop.network/',{jsonrpc:'2.0',id:1,method:'chain_getBlockHash',params:[0]}),request(faucet+'/chain'),request(faucet+'/limits')]);
            if(checks.some(x=>!x.ok)){console.error('HTTP status (RPC genesis / faucet chain / faucet limits): '+checks.map(x=>x.status).join(' / '));throw Error();}
            const [rpc,chain,limits]=await Promise.all(checks.map(x=>x.json()));
            if(rpc.result!==genesis || chain.network!=='testnet' || chain.genesisHash!==genesis || limits.network!=='testnet' || limits.stale!==false || limits.faucet?.status!=='open' || limits.faucet.agent?.claimPath!==path || limits.faucet.agent.grantFlop!==10) throw Error();
            stage='claim submission (check outcome before any new claim)';
            const nonce='1795700000000';
            const signature='0x'+sign(null,Buffer.from(['flop-faucet-agent/v1',genesis,address,nonce].join('|')),key).toString('hex');
            const response=await request(faucet+path,{address,nonce,signature});
            const result=await response.json();
            const reason=/^[a-z_]{1,64}$/.test(result.reason??'')?result.reason:'unreported';
            if(!response.ok){console.error('Faucet HTTP '+response.status+'; reason: '+reason);throw Error();}
            if(!/^0x[0-9a-f]{64}$/i.test(result.txHash??'')) throw Error();
            console.log('Faucet txHash: '+result.txHash+'; finality not verified.');

          } catch {
            console.error('Stopped at: '+stage+'');
            process.exitCode = 1;
          }
          JS
