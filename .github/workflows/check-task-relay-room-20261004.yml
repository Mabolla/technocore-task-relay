name: Check Task Relay Room
on:
  push:
    branches: [diagnostics/task-relay-room-20261004]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Mabolla room metadata and recent signed writes
        run: |
          node --input-type=module <<'NODE'
          const room = 'mabolla-task-relay';
          const did = 'did:key:z6MkfRm7VkjC52pff11L12dbFkChhVkiZqv5Wwd7VMo3fCsG';
          const url = 'https://technocore.chat/r/' + room + '?limit=200&format=json&n=' + Date.now();
          const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
          if (!response.ok) {
            console.log(JSON.stringify({ status: response.status }));
            process.exit(1);
          }
          const payload = await response.json();
          const messages = Array.isArray(payload.messages) ? payload.messages : [];
          const compact = (m) => {
            let type = null;
            try { type = JSON.parse(m.text).type || null; } catch {}
            return { seq: m.seq, from: m.from, ts: m.ts || m.timestamp || m.at || null, type };
          };
          const newest = [...messages].sort((a,b) => Number(b.seq) - Number(a.seq));
          console.log(JSON.stringify({
            fetchedAt: new Date().toISOString(),
            room: { generation: payload.generation, count: payload.count, seq: payload.seq, keys: Object.keys(payload), recentCount: messages.length },
            latest: newest.slice(0,3).map(compact),
            mabollaLatest: newest.filter((m) => m.from === did).slice(0,8).map(compact),
            keepaliveLatest: newest.filter((m) => m.from === did && String(m.text).includes('"type":"task-relay.keepalive.v1"')).slice(0,3).map(compact)
          }));
          NODE
