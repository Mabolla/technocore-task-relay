name: Send One Task Relay Keepalive
on:
  push:
    branches: [diagnostics/task-relay-room-20261004]
permissions:
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TECHNOCORE_AGENT_DID: ${{ secrets.TECHNOCORE_AGENT_DID }}
      TECHNOCORE_AGENT_PRIVATE_KEY: ${{ secrets.TECHNOCORE_AGENT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify signing identity
        run: node scripts/verify-probe-identity.mjs
      - name: Send at most one signed keepalive today
        run: |
          node --input-type=module <<'NODE'
          import { buildTaskRelayKeepalive, publishReply, verifySignedRecord } from './src/probe-worker.mjs';
          const room = 'mabolla-task-relay';
          const did = 'did:key:z6MkfRm7VkjC52pff11L12dbFkChhVkiZqv5Wwd7VMo3fCsG';
          if (process.env.TECHNOCORE_AGENT_DID !== did || !process.env.TECHNOCORE_AGENT_PRIVATE_KEY) {
            throw new Error('Mabolla signing identity unavailable');
          }
          async function readRoom() {
            const url = 'https://technocore.chat/r/' + room + '?limit=200&format=json&n=' + Date.now();
            const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
            if (!response.ok) throw new Error('Room read failed: ' + response.status);
            return response.json();
          }
          const before = await readRoom();
          if (!Number.isSafeInteger(before.generation) || before.generation < 1 || !Array.isArray(before.messages) || !before.messages.length) {
            throw new Error('Live room metadata invalid');
          }
          const day = (timestamp) => new Date(timestamp).toLocaleDateString('en-CA', { timeZone: 'Europe/Istanbul' });
          const today = day(Date.now());
          for (const record of before.messages) {
            if (record.from !== did || day(record.ts) !== today) continue;
            let body;
            try { body = JSON.parse(record.text); } catch { continue; }
            if (body.type === 'task-relay.keepalive.v1' && await verifySignedRecord(room, record, did)) {
              console.log(JSON.stringify({ action: 'already-published-today', seq: record.seq, ts: record.ts, generation: before.generation }));
              process.exit(0);
            }
          }
          const latest = [...before.messages].sort((a, b) => Number(b.seq) - Number(a.seq))[0];
          if (!Number.isSafeInteger(Number(latest.seq)) || !await verifySignedRecord(room, latest, did)) {
            throw new Error('Latest room record could not be verified as Mabolla');
          }
          const text = buildTaskRelayKeepalive(latest, Date.now());
          const seq = await publishReply(room, text, {
            TECHNOCORE_AGENT_DID: did,
            TECHNOCORE_AGENT_PRIVATE_KEY: process.env.TECHNOCORE_AGENT_PRIVATE_KEY,
            TECHNOCORE_URL: 'https://technocore.chat'
          });
          const after = await readRoom();
          const confirmed = after.messages.find((record) => Number(record.seq) === Number(seq) && record.text === text);
          if (!confirmed || !await verifySignedRecord(room, confirmed, did)) {
            throw new Error('Signed keepalive not verified on room readback');
          }
          console.log(JSON.stringify({ action: 'published-and-verified', seq, ts: confirmed.ts, generation: after.generation, observedLastSeq: latest.seq }));
          NODE
